# What the team owns: the service it wants served. Same fields as the
# operator's deploy/examples/qwen-7b.yaml.
apiVersion: inference.michelecampi.dev/v1alpha1
kind: VllmService
metadata:
  name: qwen-7b
  namespace: team-demo
spec:
  model: "Qwen/Qwen2.5-7B-Instruct"
  replicas: 1
  warmupStrategy: Eager
  image: "vllm/vllm-openai:v0.11.0"
  gpu: 1
  # Sized for a g2-standard-4 (4 vCPU / 16GB, ~3.5 CPU / ~12Gi allocatable).
  # Weights live in VRAM; RAM is for the process and loading. Estimate,
  # to be replaced by the working set measured on the first GPU run.
  cpu: "3"
  memory: "11Gi"
  objective:
    # Declared by the team. Same as the platform default (ADR-0013), stated explicitly. Budget is the team declaration, compared with measured cost (ADR-0025).
    ttftSeconds: 1.0
    percentile: 95
  budget:
    eurPerMonth: 500
