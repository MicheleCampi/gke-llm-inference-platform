# ArgoCD bootstrap values — chart argo/argo-cd 9.5.21 (appVersion v3.4.3)
#
# Profile: single-node CPU lab (system-pool, e2-standard-2).
# - Non-HA: the chart's default (1 replica per component, no redis-ha).
#   HA would need >=3 workers; out of scope for this ephemeral lab.
# - ArgoCD CRDs managed by the chart through templates/ (default crds.install=true).
#   This matters for self-management: no Helm-immutable CRDs in crds/.
# - UI through `kubectl port-forward` (ClusterIP service, the default).
#   No Ingress or LoadBalancer: no public IP, no exposed surface.
#
# No functional overrides on purpose: the official defaults fit this
# profile. ArgoCD's own metrics are not scraped: the Alloy pipeline
# (argocd/apps/alloy.yaml) collects the operator's metrics only.
