# ArgoCD bootstrap values — chart argo/argo-cd 9.5.21 (appVersion v3.4.3)
#
# Profilo: lab single-node CPU (system-pool e2-standard-2).
# - Modalità non-HA: default del chart (1 replica/componente, no redis-ha).
#   L'HA richiederebbe >=3 worker; fuori scope per questo lab effimero.
# - CRD ArgoCD gestiti dal chart via templates/ (default crds.install=true).
#   Rilevante per il self-manage: niente CRD Helm-immutable in crds/.
# - Accesso UI via `kubectl port-forward` (service ClusterIP, default).
#   Nessun Ingress/LoadBalancer: zero IP pubblico, zero superficie esposta.
#
# Override funzionali volutamente assenti: i default ufficiali sono corretti
# per questo profilo. Le metriche per la pipeline Alloy/Mimir verranno
# abilitate nel blocco observability, non qui.
