apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 1.10.0
    helm:
      releaseName: alloy
      values: |
        controller:
          type: deployment
          replicas: 1
        alloy:
          extraEnv:
            - name: GC_PROM_URL
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: url
            - name: GC_PROM_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: user
            - name: GC_PROM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-cloud-credentials
                  key: token
          configMap:
            content: |
              discovery.kubernetes "operator" {
                role = "pod"
                namespaces {
                  names = ["vllm-system"]
                }
                selectors {
                  role = "pod"
                  label = "app.kubernetes.io/name=vllm-coldstart-operator"
                }
              }

              discovery.relabel "operator" {
                targets = discovery.kubernetes.operator.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_port_name"]
                  regex = "metrics"
                  action = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label = "pod"
                }
              }

              prometheus.scrape "operator" {
                targets = discovery.relabel.operator.output
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
              }

              // The vLLM pods the operator runs. Every pod of a VllmService,
              // fleet children included, carries managed-by (operator
              // src/main.rs, build_deployment) and serves /metrics on its port
              // "http" (8000). Only up and the vLLM series of the SLO and of
              // capacity are kept, so the free plan's series stay bounded.
              discovery.kubernetes "vllm" {
                role = "pod"
                namespaces {
                  names = ["vllm-system"]
                }
                selectors {
                  role = "pod"
                  label = "app.kubernetes.io/managed-by=vllm-coldstart-operator"
                }
              }

              discovery.relabel "vllm" {
                targets = discovery.kubernetes.vllm.targets
                rule {
                  source_labels = ["__meta_kubernetes_pod_container_port_name"]
                  regex = "http"
                  action = "keep"
                }
                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  target_label = "namespace"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  target_label = "pod"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  target_label = "service"
                }
                rule {
                  source_labels = ["__meta_kubernetes_pod_label_inference_michelecampi_dev_fleet"]
                  target_label = "fleet"
                }
              }

              prometheus.scrape "vllm" {
                targets = discovery.relabel.vllm.output
                forward_to = [prometheus.relabel.vllm.receiver]
              }

              prometheus.relabel "vllm" {
                forward_to = [prometheus.remote_write.grafana_cloud.receiver]
                rule {
                  source_labels = ["__name__"]
                  regex = "up|vllm:(time_to_first_token_seconds|inter_token_latency_seconds|request_success_total|num_requests_running|num_requests_waiting).*"
                  action = "keep"
                }
              }

              prometheus.remote_write "grafana_cloud" {
                endpoint {
                  url = sys.env("GC_PROM_URL")
                  basic_auth {
                    username = sys.env("GC_PROM_USER")
                    password = sys.env("GC_PROM_TOKEN")
                  }
                }
              }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
