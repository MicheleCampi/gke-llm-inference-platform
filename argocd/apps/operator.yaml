apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-coldstart-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: workloads
  source:
    repoURL: https://github.com/MicheleCampi/vllm-coldstart-operator.git
    targetRevision: v0.9.0
    path: chart
    helm:
      releaseName: vllm-coldstart-operator
      # The chart ships an example VllmService by default. Here the models
      # come from the tenant apps (team-demo), so the example only competed
      # for the single L4: it stayed Pending all of B-009 (D-0139).
      valuesObject:
        example:
          enabled: false
        # D-0145: the reporter is the only writer of NodeState; without it a
        # FleetService with no nodePool.selector never places. GPU nodes only,
        # tolerating the GKE GPU taint; GKE injects NVML, so no runtimeClass.
        reporter:
          enabled: true
          nodeSelector:
            cloud.google.com/gke-nodepool: gpu-pool
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          extraEnv:
            - name: REPORTER_GPU
              value: nvidia
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm-system
  # On each of the chart's three CRDs the API server drops names.categories,
  # which the chart declares as an empty array, and adds names.listKind,
  # which the chart leaves out. Measured on kind with v0.8.0 and ArgoCD
  # 9.5.21: with no ignores the three CRDs stay OutOfSync and nothing else
  # does; with these two paths ignored every resource is Synced.
  # additionalPrinterColumns is no longer empty and is not ignored.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: vllmservices.inference.michelecampi.dev
      jsonPointers:
        - /spec/names/categories
        - /spec/names/listKind
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: fleetservices.inference.michelecampi.dev
      jsonPointers:
        - /spec/names/categories
        - /spec/names/listKind
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      name: nodestates.inference.michelecampi.dev
      jsonPointers:
        - /spec/names/categories
        - /spec/names/listKind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
