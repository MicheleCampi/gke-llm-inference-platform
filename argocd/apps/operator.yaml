apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm-coldstart-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/MicheleCampi/vllm-coldstart-operator.git
    targetRevision: v0.1.0
    path: chart
    helm:
      releaseName: vllm-coldstart-operator
      # Il tag pubblicato su GHCR e' 0.1.0 (senza v); il default del chart
      # punta a v0.1.0 inesistente. Override fino al fix upstream.
      parameters:
        - name: image.tag
          value: "0.1.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: vllm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
