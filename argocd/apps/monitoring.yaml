apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:MicheleCampi/gke-llm-inference-platform.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # ESO fills the Secret grafana-cloud-credentials at runtime (creationPolicy:
  # Owner), so its /data always differs from Git, where it does not exist:
  # ArgoCD reports it OutOfSync while Healthy. Ignore /data and the fields
  # managed by the external-secrets controller.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: grafana-cloud-credentials
      namespace: monitoring
      jsonPointers:
        - /data
    - group: "*"
      kind: "*"
      managedFieldsManagers:
        - external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
