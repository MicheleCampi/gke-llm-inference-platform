apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:MicheleCampi/gke-llm-inference-platform.git
    targetRevision: main
    path: monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # ESO popola il Secret grafana-cloud-credentials a runtime (creationPolicy:
  # Owner), quindi il suo /data diverge sempre da Git (dove non esiste): ArgoCD
  # lo segnala OutOfSync pur essendo Healthy. Ignoriamo data + i campi gestiti
  # dal controller external-secrets.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: grafana-cloud-credentials
      namespace: monitoring
      jsonPointers:
        - /data
    - group: "*"
      kind: "*"
      managedFieldsManagers:
        - external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
