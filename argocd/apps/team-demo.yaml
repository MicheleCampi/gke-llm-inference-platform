# One file per team. The team can deliver only VllmService and FleetService,
# only into team-demo, only from this repository; the platform owns its
# namespace and GPU quota (tenants/demo). ci/check-tenancy.py enforces this.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: team-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  description: 'Team demo: inference workloads in team-demo only'
  sourceRepos:
  - git@github.com:MicheleCampi/gke-llm-inference-platform.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: team-demo
  namespaceResourceWhitelist:
  - group: inference.michelecampi.dev
    kind: VllmService
  - group: inference.michelecampi.dev
    kind: FleetService
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tenancy
  source:
    repoURL: git@github.com:MicheleCampi/gke-llm-inference-platform.git
    targetRevision: v0.4.0
    path: tenants/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: team-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-demo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: team-demo
  source:
    repoURL: git@github.com:MicheleCampi/gke-llm-inference-platform.git
    targetRevision: v0.4.0
    path: teams/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: team-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
