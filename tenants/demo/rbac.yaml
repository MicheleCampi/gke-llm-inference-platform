# Team identity, owned by the platform (project tenancy). The team deploys models and reads
# its own pods, logs and limits; it cannot change quota, LimitRange, NetworkPolicy or RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: team-demo-deployer
  namespace: team-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: team-developer
  namespace: team-demo
rules:
- apiGroups: ["inference.michelecampi.dev"]
  resources: ["vllmservices"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["pods", "pods/log", "events", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["resourcequotas", "limitranges"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: team-developer
  namespace: team-demo
subjects:
- kind: ServiceAccount
  name: team-demo-deployer
  namespace: team-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: team-developer
