# Default-deny ingress: no other team can reach these pods. Allowed: the same
# namespace, and vLLM /metrics (port 8000) from Alloy (monitoring) and the
# operator's reporter (vllm-system). Egress stays open: pods download the model.
# Enforced only with Dataplane V2 (terraform/modules/gke-gpu/main.tf).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: team-demo
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vllm-system
      ports:
        - protocol: TCP
          port: 8000
