apiVersion: v1
kind: LimitRange
metadata:
  name: team-defaults
  namespace: team-b
spec:
  limits:
    - type: Container
      # Defaults are a safety net for small pods that declare nothing.
      # Workloads that need more declare it: VllmService spec.cpu/memory
      # (operator #77). No default CPU limit: a default limit would reject
      # any CPU request above it; without one, max.cpu is the cap.
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
      max:
        cpu: "8"
        memory: 32Gi
